services:
  ros2_humble:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Hardcoded, NOT interpolated: the shell environment overrides .env in
        # compose, so a sourced /opt/ros/<other>/setup.bash on the host would
        # leak its ROS_DISTRO in here and break the apt package names.
        ROS_DISTRO: humble
        USERNAME: ${USERNAME:-dogu}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        WS_DIR: ${WS_DIR:-/home/dogu/ros2_humble_ws}
        VIDEO_GID: ${VIDEO_GID:-44}
        RENDER_GID: ${RENDER_GID:-993}
        INPUT_GID: ${INPUT_GID:-996}
        # auto = Gazebo Classic on amd64, skipped on arm64 (no arm64 build
        # of ros-humble-gazebo-ros-pkgs exists). yes = try anyway.
        INSTALL_SIM: ${INSTALL_SIM:-auto}
    image: ros2-humble-ws:latest
    container_name: ros2_humble_ws
    hostname: ros2-humble

    # Jetson: the NVIDIA container runtime bind-mounts the L4T driver stack
    # (listed in /etc/nvidia-container-runtime/host-files-for-container.d/*.csv)
    # into the container, which is what makes hardware GL work for rviz2 and
    # gazebo. On a machine without nvidia-container-toolkit, comment this line
    # out and rely on /dev/dri + mesa instead.
    runtime: nvidia

    # host networking + host IPC: DDS discovery and X shared memory both
    # behave like a native install this way.
    network_mode: host
    ipc: host

    environment:
      # ROS 2 has no roscore: nodes find each other over DDS. Peers must share
      # a ROS_DOMAIN_ID; set ROS_LOCALHOST_ONLY=1 to stay off the LAN.
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.docker.xauth
      - QT_X11_NO_MITSHM=1
      # Consumed by the nvidia runtime above; ignored without it.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # 1 = llvmpipe software rendering; use it if GUIs crash on the GPU.
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-0}
      # Ignition looks for system plugins here. ign_ros2_control has no arm64
      # binary release, so it is built from source into the workspace overlay
      # rather than living in /opt/ros/humble/lib where antbot_gazebo's
      # gazebo.launch.py expects it. That launch file APPENDS to whatever this
      # variable already holds, so setting it here is what lets Ignition find
      # libign_ros2_control-system.so. Without it the sim starts but no
      # controller ever loads.
      - IGN_GAZEBO_SYSTEM_PLUGIN_PATH=${WS_DIR:-/home/dogu/ros2_humble_ws}/install/gz_ros2_control/lib

    volumes:
      # Whole workspace, so colcon's build/install/log persist on the host.
      - ..:${WS_DIR:-/home/dogu/ros2_humble_ws}
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.docker.xauth:/tmp/.docker.xauth:rw
      - ${HOME}/.ssh:/home/${USERNAME:-dogu}/.ssh:ro
      # Joysticks/gamepads for joy_linux_node. Bind-mounted as a volume rather
      # than listed under `devices:` on purpose: `devices:` snapshots the nodes
      # that exist at container start, so a pad plugged in later never shows up.
      # The bind mount tracks the host's /dev/input live, and the cgroup rule
      # below is what actually grants access to the nodes it exposes.
      - /dev/input:/dev/input:ro

    devices:
      - /dev/dri:/dev/dri          # DRM render nodes for rviz2 / gazebo

    # char major 13 = the input subsystem (js*, event*, mice). Needed alongside
    # the /dev/input bind mount above; without it the device files are visible
    # but every open() fails with "Operation not permitted".
    device_cgroup_rules:
      - 'c 13:* rmw'

    group_add:
      - "${INPUT_GID:-996}"        # host 'input' gid, owner of /dev/input/js*

    # --- Real robot: ANT-RCU + sensors over USB serial --------------------
    # Uncomment the block below to run antbot_hw_interface against the real
    # hardware. The ANTBot expects FOUR FTDI ports; the assignment comes from
    # the launch files, not from the board:
    #   ttyUSB0  ANT-RCU control board  (antbot_hw_interface/config/board_params.yaml)
    #   ttyUSB1  IMU board              (antbot_imu)
    #   ttyUSB2  2D LiDAR "lidar_1"     (antbot_bringup/launch/lidar_2d.launch.py)
    #   ttyUSB3  2D LiDAR "lidar_0"     (same file)
    # NOTE: entries under `devices:` must already exist when the container
    # starts, or `up` fails -- power the robot on first, confirm all four with
    # `ls /dev/ttyUSB*`, then start the container. (Unlike /dev/input above,
    # these cannot be bind-mounted for hotplug: they live directly in /dev.)
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyUSB1:/dev/ttyUSB1
    #   - /dev/ttyUSB2:/dev/ttyUSB2
    #   - /dev/ttyUSB3:/dev/ttyUSB3
    # The ports are owned by root:dialout, so the container user needs that
    # gid added to the group_add list above (host 'dialout' = 20 here).

    stdin_open: true
    tty: true
    command: bash
