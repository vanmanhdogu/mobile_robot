# World name -> SDF file, resolved by launch/gazebo.launch.py.
# Usage: ros2 launch mobile_base_sim gazebo.launch.py world:=box_room
#
# An absolute path is also accepted and bypasses this file entirely, e.g.
#   world:=$(ros2 pkg prefix antbot_gazebo)/share/antbot_gazebo/worlds/depot.sdf

worlds:
  empty:
    sdf: empty.sdf
  box_room:
    sdf: box_room.sdf
